<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>登录｜西湖大学能源管理平台</title>
  <style>
    :root{--blue:#176bff;--blue-dark:#0a1776;--muted:#7b88ad;--glass:rgba(255,255,255,.43);--radius:20px;--shadow:0 18px 48px rgba(37,112,190,.16),inset 0 1px 0 rgba(255,255,255,.92),inset 0 -1px 0 rgba(255,255,255,.28);--font-family-sans:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;--font-heading:34px/1.25 var(--font-family-sans);--font-title:20px/1.4 var(--font-family-sans);--font-body:16px/1.625 var(--font-family-sans);--font-label:500 13px/1.55 var(--font-family-sans);--font-caption:12px/1.5 var(--font-family-sans)}
    *{box-sizing:border-box}
    html{background:#e5f2fb}
    body{margin:0;color:var(--blue-dark);font-family:var(--font-family-sans);-webkit-font-smoothing:antialiased}
    button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible+label{outline:3px solid rgba(23,107,255,.26);outline-offset:3px}
    .app{position:relative;width:min(100%,430px);min-height:930px;height:auto;margin:auto;overflow:hidden;background:radial-gradient(circle at 7% 65%,rgba(87,169,255,.34),transparent 32%),radial-gradient(circle at 96% 76%,rgba(72,236,204,.34),transparent 34%),linear-gradient(145deg,#eaf4ff 0%,#edfaff 46%,#e8fff9 100%);padding:462px 16px 22px;display:flex;flex-direction:column}
    .app::before{content:"";position:absolute;width:360px;height:360px;top:12px;left:50%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.92),rgba(205,240,255,.38) 54%,transparent 72%);filter:blur(8px);pointer-events:none}
    .app::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.08),transparent 48%,rgba(189,255,239,.12) 100%)}
    .status-bar{position:absolute;z-index:6;top:0;left:0;right:0;height:44px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;color:#10183f;font-size:14px;line-height:20px;font-weight:600;font-variant-numeric:tabular-nums}
    .system-status{display:flex;align-items:center;gap:7px}.wifi{width:17px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}.battery{position:relative;width:24px;height:12px;border:1.5px solid currentColor;border-radius:3px}.battery::before{content:"";position:absolute;inset:2px;width:16px;border-radius:1px;background:currentColor}.battery::after{content:"";position:absolute;right:-3.5px;top:3px;width:2px;height:4px;border-radius:0 2px 2px 0;background:currentColor}
    .mini-capsule{position:absolute;z-index:6;top:50px;right:12px;width:88px;height:32px;padding:0;border:1px solid rgba(9,20,93,.14);border-radius:999px;background:rgba(255,255,255,.70);box-shadow:0 2px 8px rgba(23,107,255,.06);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-evenly;color:#17213f}.mini-capsule::after{content:"";position:absolute;left:50%;width:1px;height:18px;background:rgba(9,20,93,.12)}.more-dots{font-size:20px;line-height:1;letter-spacing:1px;transform:translateY(-3px)}.capsule-ring{width:14px;height:14px;border:2px solid currentColor;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.72)}
    .hero-mascot{position:absolute;z-index:1;top:44px;left:50%;width:390px;height:390px;transform:translateX(-50%);object-fit:contain;pointer-events:none}
    .login-card{position:relative;z-index:1;padding:34px 26px 28px;border:1px solid rgba(255,255,255,.80);border-radius:var(--radius);background:linear-gradient(135deg,rgba(255,255,255,.62),var(--glass) 56%,rgba(255,255,255,.30));box-shadow:var(--shadow);backdrop-filter:blur(26px) saturate(155%);-webkit-backdrop-filter:blur(26px) saturate(155%)}
    .brand{margin:0 0 10px;font:600 var(--font-body);letter-spacing:.03em}
    h1{margin:0;font:700 var(--font-heading);letter-spacing:-.035em}
    .subtitle{margin:8px 0 28px;color:var(--muted);font:var(--font-body)}
    .wechat-login{width:100%;height:62px;border:1px solid rgba(255,255,255,.65);border-radius:16px;color:#fff;background:linear-gradient(105deg,#3699ff,#176bff);box-shadow:0 9px 22px rgba(23,107,255,.22);font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:12px;transition:transform .18s ease,filter .18s ease}
    .wechat-login:hover{filter:brightness(1.04)}.wechat-login:active{transform:scale(.985)}
    .wechat-icon{display:block;width:30px;height:30px;object-fit:contain;filter:brightness(0) invert(1)}
    .hint{margin:18px 0 24px;text-align:center;color:var(--muted);font:var(--font-label)}
    .consent{display:flex;align-items:flex-start;gap:11px;color:#7180a8;font:var(--font-label)}
    .consent input{position:absolute;opacity:0;pointer-events:none}.check{flex:0 0 20px;width:20px;height:20px;margin-top:1px;border:1.5px solid #8e9abc;border-radius:50%;background:rgba(255,255,255,.5);display:grid;place-items:center;transition:.18s}.consent input:checked+label .check{border-color:var(--blue);background:var(--blue)}.consent input:checked+label .check::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px)}
    .consent label{display:flex;align-items:flex-start;gap:11px;cursor:pointer}.consent a{color:#075dff;text-decoration:none}.consent a:hover{text-decoration:underline}
    .footer{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:16px;margin-top:auto;padding-top:22px;color:#7185ad;font:var(--font-label)}.footer::before,.footer::after{content:"";width:32px;height:1px;background:#91a8cc}
    .toast{position:fixed;z-index:10;left:50%;bottom:28px;max-width:calc(100% - 40px);padding:10px 16px;border-radius:999px;background:#102342;color:#fff;font-size:13px;white-space:nowrap;opacity:0;transform:translate(-50%,12px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:380px){.app{padding-top:414px;padding-bottom:16px}.hero-mascot{top:46px;width:350px;height:350px}.login-card{padding:25px 20px 22px}h1{font-size:32px}.subtitle{font-size:15px;margin-bottom:20px}.hint{margin:14px 0 18px}.footer{padding-top:16px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
    @media(prefers-reduced-transparency:reduce){.login-card{background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none}}
  </style>
</head>
<body>
  <main class="app">
    <header class="status-bar" aria-label="手机状态栏">
      <time datetime="09:41">9:41</time>
      <div class="system-status" aria-label="Wi-Fi 已连接，电池电量充足">
        <svg class="wifi" viewBox="0 0 20 16" aria-hidden="true"><path d="M2 5.5a12 12 0 0 1 16 0M5 9a7.6 7.6 0 0 1 10 0M8.2 12.3a2.8 2.8 0 0 1 3.6 0"/><circle cx="10" cy="14.2" r=".8" fill="currentColor" stroke="none"/></svg>
        <span class="battery" aria-hidden="true"></span>
      </div>
    </header>
    <button class="mini-capsule" type="button" aria-label="微信小程序菜单"><span class="more-dots">•••</span><span class="capsule-ring" aria-hidden="true"></span></button>
    <img class="hero-mascot" src="exec-9b9650c1-edc1-47ca-9b94-c9742b7feea8.png" alt="蓝白色能源服务机器人，身边环绕电力与水滴标识">
    <section class="login-card" aria-labelledby="login-title">
      <p class="brand">西湖大学能源管理平台</p>
      <h1 id="login-title">欢迎回来</h1>
      <p class="subtitle">校园水电服务，查询余额与便捷充值</p>
      <button class="wechat-login" id="loginButton" type="button">
        <img class="wechat-icon" src="svg/wechat-fill.svg" alt="">
        微信授权登录
      </button>
      <p class="hint">首次登录将自动完成校园身份核验</p>
      <div class="consent">
        <input id="consent" type="checkbox">
        <label for="consent"><span class="check" aria-hidden="true"></span><span>我已阅读并同意 <a href="#" data-doc="《用户服务协议》">《用户服务协议》</a> 和 <a href="#" data-doc="《隐私政策》">《隐私政策》</a></span></label>
      </div>
    </section>
    <footer class="footer">西湖大学 · 校园能源服务</footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const consent=document.querySelector('#consent');
    const toast=document.querySelector('#toast');
    let toastTimer;
    function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2200)}
    document.querySelector('#loginButton').addEventListener('click',()=>{
      if(!consent.checked){showToast('请先阅读并同意用户协议与隐私政策');consent.focus();return}
      showToast('即将进入首页');setTimeout(()=>location.href='index.html',650);
    });
    document.querySelectorAll('[data-doc]').forEach(link=>link.addEventListener('click',event=>{event.preventDefault();event.stopPropagation();showToast(`${link.dataset.doc}内容待接入`)}));
  </script>
</body>
</html>
