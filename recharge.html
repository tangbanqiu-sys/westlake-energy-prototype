<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>水电充值｜西湖大学能源管理平台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css">
  <style>
    :root{--blue:#176bff;--teal:#00b99f;--ink:#07124f;--muted:#6f7da2;--line:#e4ebf6;--glass:rgba(255,255,255,.76);--radius:16px;--font:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;--shadow:0 8px 26px rgba(23,107,255,.09)}
    *{box-sizing:border-box}html{background:#e6f0fa}body{margin:0;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}button,a,[role="button"],input,label{-webkit-tap-highlight-color:transparent}button,a{-webkit-touch-callout:none}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid rgba(23,107,255,.24);outline-offset:2px}
    .app{position:relative;width:min(100%,430px);min-height:930px;margin:auto;overflow:hidden;background:radial-gradient(circle at 8% 38%,rgba(87,169,255,.18),transparent 31%),linear-gradient(180deg,#eff7ff,#f8fbff 52%,#edf6ff);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
    .hero{position:relative;height:174px;padding-top:68px;overflow:hidden;border-radius:0 0 28px 28px;background:linear-gradient(125deg,#72b7ff,#74dddf 58%,#92f2d6)}.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,rgba(255,255,255,.12),transparent 62%);pointer-events:none}
    .statusbar{position:absolute;z-index:6;top:0;left:0;right:0;height:40px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;color:#0d1947;font-size:13px;font-weight:600}.system{display:flex;align-items:center;gap:6px;font-size:16px}
    .back{position:absolute;z-index:5;left:12px;top:54px;width:44px;height:44px;border:0;background:transparent;color:#fff;font-size:36px;line-height:36px}.page-title{position:relative;z-index:3;margin:0;text-align:center;color:#fff;font-size:24px;line-height:34px;font-weight:700;letter-spacing:.08em}.bolt{position:absolute;left:72px;top:43px;width:42px;height:70px;opacity:.52;clip-path:polygon(48% 0,100% 0,68% 39%,100% 39%,24% 100%,43% 52%,0 52%);background:linear-gradient(145deg,#fff,rgba(255,255,255,.16))}
    .hero-mascot{position:absolute;z-index:2;right:-2px;bottom:-24px;width:158px;height:173px;object-fit:contain;object-position:center bottom;pointer-events:none}
    .room-card{position:absolute;z-index:5;left:14px;right:14px;top:132px;height:82px;padding:18px 22px;border:1px solid rgba(255,255,255,.66);border-radius:17px;background:rgba(255,255,255,.46);box-shadow:0 10px 28px rgba(33,113,188,.11),inset 0 1px 0 rgba(255,255,255,.76);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%)}.room-name{font-size:17px;line-height:25px;font-weight:700;white-space:nowrap}.verified{display:flex;align-items:center;gap:7px;margin-top:6px;color:#00a98e;font-size:13px;line-height:18px}.verified i{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#00af91;color:#fff;font-size:12px}
    .content{padding:53px 16px 16px}.section{margin-top:15px}.section:first-child{margin-top:0}.section h2{margin:0 5px 8px;font-size:20px;line-height:28px}.card{border:1px solid rgba(255,255,255,.94);border-radius:16px;background:var(--glass);box-shadow:var(--shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
    .account-card{padding:12px}.account-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.account{height:62px;padding:8px 10px;border:1.5px solid transparent;border-radius:13px;background:rgba(247,250,255,.82);display:flex;align-items:center;gap:9px;color:var(--ink);font-size:16px;font-weight:600}.account.active{border-color:var(--blue);background:rgba(255,255,255,.92)}.orb{width:46px;height:46px;flex:0 0 46px;object-fit:contain}.radio{margin-left:auto;width:21px;height:21px;border:2px solid #b6c3dc;border-radius:50%}.active .radio{border-color:var(--blue);box-shadow:inset 0 0 0 5px #fff;background:var(--blue)}
    .balance{display:none}
    .amount-card{padding:12px}.preset-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.amount-btn{height:48px;border:0;border-radius:11px;background:#eef4fd;color:var(--ink);font-size:17px;font-weight:700}.amount-btn.active{color:#fff;background:linear-gradient(110deg,#3096ff,var(--blue));box-shadow:0 7px 16px rgba(23,107,255,.20)}.custom-label{display:block;margin:11px 3px 6px;color:var(--muted);font-size:13px}.custom-input{width:100%;height:42px;padding:0 13px;border:1px solid #dce6f6;border-radius:11px;background:rgba(255,255,255,.70);color:var(--ink);font-size:16px}.custom-input::placeholder{color:#b4bfd5}.note{margin:9px 3px 0;color:var(--muted);font-size:12px;line-height:18px}
    .payment-list{overflow:hidden}.payment-row{width:100%;height:60px;padding:8px 16px;border:0;border-radius:0;background:transparent;display:flex;align-items:center;gap:12px;color:var(--ink);text-align:left}.payment-row+.payment-row{border-top:1px solid var(--line)}.pay-icon{display:grid;place-items:center;width:42px;height:42px;flex:0 0 42px;border-radius:11px;color:#fff}.wechat{background:linear-gradient(145deg,#1bd36b,#00a94d)}.wechat img{width:27px;height:27px;filter:brightness(0) invert(1)}.alipay{background:linear-gradient(145deg,#28a6ff,#0878ed);font-size:27px}.payment-name{font-size:16px;font-weight:600}.payment-row .radio{margin-left:auto}.payment-row.active .radio{border-color:var(--blue);box-shadow:inset 0 0 0 5px #fff;background:var(--blue)}.pay-button{width:100%;height:50px;margin-top:11px;border:0;border-radius:14px;color:#fff;background:linear-gradient(105deg,#2798ff,var(--blue));box-shadow:0 9px 22px rgba(23,107,255,.20);font-size:18px;font-weight:700}
    .tabbar{position:fixed;z-index:20;left:50%;right:auto;bottom:0;transform:translateX(-50%);width:min(100%,430px);height:calc(72px + env(safe-area-inset-bottom));padding:8px 48px env(safe-area-inset-bottom);display:flex;align-items:flex-start;justify-content:space-between;border-top:1px solid rgba(255,255,255,.94);border-radius:0;background:rgba(255,255,255,.90);box-shadow:0 -8px 24px rgba(23,107,255,.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}.nav{width:56px;height:56px;border:0;background:transparent;color:#737e9d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px}.nav i{font-size:24px}.nav.active{color:var(--blue)}
    .toast{position:fixed;z-index:20;left:50%;bottom:86px;max-width:calc(100% - 40px);padding:10px 15px;border-radius:999px;background:#102342;color:#fff;font-size:13px;white-space:nowrap;opacity:0;transform:translate(-50%,10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:380px){.content{padding-left:12px;padding-right:12px}.room-card{left:12px;right:12px;padding-left:16px}.room-name{font-size:15px}.preset-grid{gap:6px}.amount-btn{font-size:15px}.hero-mascot{right:-15px}.tabbar{padding-left:34px;padding-right:34px}}
    .motion-ready .entry-card{opacity:0;transform:translateY(20px) scale(.985);filter:blur(4px);transition:opacity .52s cubic-bezier(.22,1,.36,1),transform .58s cubic-bezier(.22,1,.36,1),filter .42s ease;transition-delay:var(--entry-delay,0ms);will-change:opacity,transform,filter}.motion-ready .entry-card.is-entered{opacity:1;transform:none;filter:none}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}.motion-ready .entry-card{opacity:1;transform:none;filter:none}}@media(prefers-reduced-transparency:reduce){.room-card,.card,.tabbar{background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none}}
  </style>
  <link rel="stylesheet" href="bottom-navigation.css">
</head>
<body>
  <!-- Figma 可替换资源：按 data-asset-slot 查找对应视觉层；HTML 保留真实图片与图标。 -->
  <main class="app">
    <header class="hero"><!-- 浏览器预览不显示模拟系统状态栏：<div class="statusbar"><time datetime="09:41">9:41</time><span class="system"><i class="ri-wifi-fill" data-asset-slot="status-wifi" aria-hidden="true"></i><i class="ri-battery-fill" data-asset-slot="status-battery" aria-hidden="true"></i></span></div> --><button class="back" data-asset-slot="back-icon" aria-label="返回首页">‹</button><span class="bolt" data-asset-slot="hero-decoration" aria-hidden="true"></span><h1 class="page-title">水电充值</h1><img class="hero-mascot" data-asset-slot="hero-ip" src="output/ip/lanbao-recharge-pointing-user.webp" alt="举手指引的蓝宝机器人"></header>
    <section class="room-card" aria-label="当前充值房间"><div class="room-name">云栖校区 · A区 · A栋 · 1F · 101</div><div class="verified"><i class="ri-check-line" data-asset-slot="verified-icon" aria-hidden="true"></i>校园名单验证通过 · 林田田</div></section>
    <div class="content">
      <section class="section"><h2>充值账户</h2><div class="card account-card"><div class="account-tabs"><button class="account active" data-type="electric"><img class="orb" data-asset-slot="electricity-icon" src="output/icons/electricity-fee-icon-orbit.webp" alt="电费图标">电费<span class="radio"></span></button><button class="account" data-type="water"><img class="orb" data-asset-slot="water-icon" src="output/icons/water-fee-icon-orbit.webp" alt="水费图标">水费<span class="radio"></span></button></div><div class="balance" id="balance"><span>余额</span><strong id="balanceValue">¥105.68</strong></div></div></section>
      <section class="section"><h2>充值金额</h2><div class="card amount-card"><div class="preset-grid"><button class="amount-btn active" data-value="100">¥100</button><button class="amount-btn" data-value="50">¥50</button><button class="amount-btn" data-value="30">¥30</button><button class="amount-btn" data-value="20">¥20</button></div><label class="custom-label" for="customAmount">自定义金额</label><input class="custom-input" id="customAmount" inputmode="numeric" maxlength="4" placeholder="请输入整数金额"><p class="note">单笔及单日累计充值最高 ¥1000；不允许输入小数。<br>支付后请等待到账结果，勿重复付款。</p></div></section>
      <section class="section"><h2>支付方式</h2><div class="card payment-list"><button class="payment-row active" data-payment="微信支付"><span class="pay-icon wechat" data-asset-slot="wechat-icon"><img src="svg/wechat-fill.svg" alt=""></span><span class="payment-name">微信支付</span><span class="radio"></span></button><button class="payment-row" data-payment="支付宝支付"><span class="pay-icon alipay" data-asset-slot="alipay-icon"><i class="ri-alipay-fill" aria-hidden="true"></i></span><span class="payment-name">支付宝支付</span><span class="radio"></span></button></div><button class="pay-button" id="payButton">确认支付 ¥100</button></section>
    </div>
    <nav class="tabbar" aria-label="底部导航"><button class="nav" data-nav="home"><span class="nav-icon" aria-hidden="true"><img src="assets/nav/home.svg" alt=""></span><span>首页</span></button><button class="nav active"><span class="nav-icon" aria-hidden="true"><img src="assets/nav/recharge-active.svg" alt=""></span><span>充值</span></button><button class="nav" data-nav="profile"><span class="nav-icon" aria-hidden="true"><img src="assets/nav/profile.svg" alt=""></span><span>我的</span></button></nav>
  </main><div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const state={type:'electric',amount:100,payment:'微信支付'},balances={electric:'¥105.68',water:'¥42.00'};const balance=document.querySelector('#balance'),balanceValue=document.querySelector('#balanceValue'),custom=document.querySelector('#customAmount'),payButton=document.querySelector('#payButton'),toast=document.querySelector('#toast');let toastTimer;
    function notify(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2000)}function render(){payButton.textContent=`确认支付 ¥${state.amount||0}`}
    function selectAccount(type){const selected=[...document.querySelectorAll('.account')].find(item=>item.dataset.type===type)||document.querySelector('.account');document.querySelectorAll('.account').forEach(item=>item.classList.toggle('active',item===selected));state.type=selected.dataset.type;balanceValue.textContent=balances[state.type];balance.classList.toggle('water',state.type==='water')}
    document.querySelectorAll('.account').forEach(button=>button.addEventListener('click',()=>selectAccount(button.dataset.type)));
    document.querySelectorAll('.amount-btn').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.amount-btn').forEach(item=>item.classList.toggle('active',item===button));custom.value='';state.amount=Number(button.dataset.value);render()}));
    custom.addEventListener('input',()=>{custom.value=custom.value.replace(/\D/g,'').slice(0,4);if(Number(custom.value)>1000)custom.value='1000';document.querySelectorAll('.amount-btn').forEach(item=>item.classList.remove('active'));state.amount=Number(custom.value)||0;render()});document.querySelectorAll('.payment-row').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.payment-row').forEach(item=>item.classList.toggle('active',item===button));state.payment=button.dataset.payment}));payButton.addEventListener('click',()=>state.amount?notify(`暂时无法使用${state.payment}支付`):(notify('请输入充值金额'),custom.focus()));document.querySelector('.back').addEventListener('click',()=>location.href='index.html');document.querySelector('[data-nav="home"]').addEventListener('click',()=>location.href='index.html');document.querySelector('[data-nav="profile"]').addEventListener('click',()=>location.href='my.html');selectAccount(new URLSearchParams(location.search).get('type')||'electric');
  </script>
  <script>
    payButton.addEventListener('click',event=>{event.stopImmediatePropagation();if(!state.amount){notify('请输入充值金额');custom.focus();return}const params=new URLSearchParams({amount:String(state.amount),type:state.type,payment:state.payment});location.href='recharge-result.html?'+params},true);
  </script>
  <script>
    function setupCardEntrance(){const cards=[...document.querySelectorAll('.room-card,.section .card')];if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){cards.forEach(card=>card.classList.add('is-entered'));return}document.documentElement.classList.add('motion-ready');cards.forEach((card,index)=>{card.classList.add('entry-card');card.style.setProperty('--entry-delay',`${Math.min(index,3)*70}ms`)});const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(!entry.isIntersecting)return;entry.target.classList.add('is-entered');observer.unobserve(entry.target)}),{threshold:.16,rootMargin:'0px 0px -24px'});requestAnimationFrame(()=>cards.forEach(card=>observer.observe(card)))}
    setupCardEntrance();
  </script>
</body>
</html>
