<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用能详情｜西湖大学能源管理平台</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"><link rel="stylesheet" href="prototype-flow.css"><link rel="stylesheet" href="usage-visual.css"><link rel="stylesheet" href="bottom-navigation.css"></head><body><main class="app"><header class="hero"><div class="status"><span>9:41</span><span><i class="ri-wifi-fill"></i> <i class="ri-battery-fill"></i></span></div><h1>用能详情</h1><p>云栖校区 · A栋 · 1F · 101</p></header><div class="content"><div class="tabs" role="tablist" aria-label="用能类别"><button class="tab active" type="button" data-kind="electric" role="tab" aria-selected="true">用电</button><button class="tab" type="button" data-kind="water" role="tab" aria-selected="false">用水</button></div><div class="card"><h2 id="title">近 5 日用电</h2><div class="detail"><span>今日</span><b id="today">3.5 kWh</b></div><div class="detail"><span>昨日</span><b id="yesterday">3.9 kWh</b></div><div class="detail"><span>近 7 日平均</span><b id="average">3.8 kWh</b></div></div><div class="card"><h2>每日用量</h2><div id="days"></div></div><div class="action-stack"><button class="secondary" id="empty">查看空数据状态</button><button class="primary" id="back">返回首页</button></div></div><nav class="tabbar"><button class="nav active" id="home"><span class="nav-icon" aria-hidden="true"><img src="assets/nav/home-active.svg" alt=""></span><span>首页</span></button><button class="nav" id="recharge"><span class="nav-icon" aria-hidden="true"><img src="assets/nav/recharge.svg" alt=""></span><span>充值</span></button><button class="nav" id="mine"><span class="nav-icon" aria-hidden="true"><img src="assets/nav/profile.svg" alt=""></span><span>我的</span></button></nav></main><script>const data={electric:{label:'用电',unit:'kWh',today:'3.5',yesterday:'3.9',average:'3.8',days:['3.2','4.1','3.5','4.0','3.7']},water:{label:'用水',unit:'吨',today:'0.3',yesterday:'0.4',average:'0.35',days:['0.30','0.42','0.36','0.31','0.38']}};function render(kind){const d=data[kind];document.querySelectorAll('[data-kind]').forEach(b=>{const active=b.dataset.kind===kind;b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active))});document.querySelector('#title').textContent='近 5 日'+d.label;for(const id of ['today','yesterday','average'])document.getElementById(id).textContent=d[id]+' '+d.unit;document.querySelector('#days').innerHTML=d.days.map((v,i)=>`<div class="detail"><span>09-${String(i+8).padStart(2,'0')}</span><b>${v} ${d.unit}</b></div>`).join('')}document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>render(b.dataset.kind));document.querySelector('#empty').onclick=()=>location.href='system-states.html?view=empty';document.querySelector('#back').onclick=()=>location.href='index.html';document.querySelector('#home').onclick=()=>location.href='index.html';document.querySelector('#recharge').onclick=()=>location.href='recharge.html';document.querySelector('#mine').onclick=()=>location.href='my.html';render('electric');</script></body></html>
