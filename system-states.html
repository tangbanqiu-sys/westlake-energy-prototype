<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通用状态｜西湖大学能源管理平台</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"><link rel="stylesheet" href="prototype-flow.css"><link rel="stylesheet" href="bottom-navigation.css"></head><body><main class="app"><header class="hero"><div class="status"><span>9:41</span><span><i class="ri-wifi-fill"></i> <i class="ri-battery-fill"></i></span></div><h1>通用状态</h1><p>空数据 · 网络异常 · 登录失效</p></header><div class="content"><div class="state-tabs" id="states"></div><div class="card center"><i id="icon" class="icon"></i><h2 id="title"></h2><p class="muted" id="copy"></p><div class="hint" id="hint" style="margin:16px 0"></div><div class="action-stack"><button class="primary" id="primary"></button><button class="secondary" id="secondary">返回首页</button></div></div></div><nav class="tabbar"><button class="nav" id="home"><span class="nav-icon" aria-hidden="true"><img src="assets/nav/home.svg" alt=""></span><span>首页</span></button><button class="nav" id="recharge"><span class="nav-icon" aria-hidden="true"><img src="assets/nav/recharge.svg" alt=""></span><span>充值</span></button><button class="nav" id="mine"><span class="nav-icon" aria-hidden="true"><img src="assets/nav/profile.svg" alt=""></span><span>我的</span></button></nav></main><div class="toast" id="toast" role="status"></div><script>const states={empty:{label:'空数据',icon:'ri-inbox-2-line',title:'暂无用能记录',copy:'该房间在所选时间范围内还没有用水或用电数据。',hint:'可以切换时间范围或稍后再查看。',action:'返回账单'},network:{label:'网络异常',icon:'ri-wifi-off-line',title:'暂时无法获取数据',copy:'网络连接异常，余额和账单可能不是最新信息。',hint:'充值前请确认账户与余额信息。',action:'重新加载'},expired:{label:'登录失效',icon:'ri-lock-2-line',title:'登录已失效',copy:'为保护账户信息，请重新完成微信授权登录。',hint:'请重新登录后继续。',action:'前往登录页'}};const toast=document.querySelector('#toast');function notify(text){toast.textContent=text;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1700)}function render(key){if(!states[key])key='empty';let s=states[key];document.querySelector('#states').innerHTML=Object.keys(states).map(k=>`<button class="${key===k?'active':''}" data-state="${k}">${states[k].label}</button>`).join('');document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>render(b.dataset.state));document.querySelector('#icon').className=s.icon+' icon';for(const [id,value] of Object.entries({title:s.title,copy:s.copy,hint:s.hint,primary:s.action}))document.getElementById(id).textContent=value;document.querySelector('#primary').onclick=()=>{if(key==='empty')location.href='orders.html';else if(key==='expired')location.href='login.html';else notify('网络仍未恢复')};history.replaceState(null,'','system-states.html?view='+key)}document.querySelector('#secondary').onclick=()=>location.href='index.html';document.querySelector('#home').onclick=()=>location.href='index.html';document.querySelector('#recharge').onclick=()=>location.href='recharge.html';document.querySelector('#mine').onclick=()=>location.href='my.html';render(new URLSearchParams(location.search).get('view'));</script></body></html>
