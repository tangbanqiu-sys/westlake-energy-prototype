<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>充值记录｜西湖大学能源管理平台</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"><link rel="stylesheet" href="prototype-flow.css"><link rel="stylesheet" href="orders-visual.css"><link rel="stylesheet" href="bottom-navigation.css"></head><body><main class="app"><header class="hero"><div class="status"><span>9:41</span><span><i class="ri-wifi-fill"></i> <i class="ri-battery-fill"></i></span></div><button class="back-detail" id="backDetail" aria-label="返回充值记录" hidden><i class="ri-arrow-left-s-line"></i></button><h1>充值记录</h1><p id="heroRoom">云栖校区 · A栋 · 1F · 101</p></header><div class="content"><section class="view" data-view="list"><h2 class="section-title">最近订单</h2><div class="card"><button class="option" data-order="success"><i class="ri-flashlight-line"></i><span>电费充值 · ¥100<small>2026-09-12 14:32 · 充值成功</small></span><i class="ri-arrow-right-s-line"></i></button><button class="option" data-order="failed"><i class="ri-drop-line"></i><span>水费充值 · ¥50<small>2026-09-11 09:15 · 充值失败</small></span><i class="ri-arrow-right-s-line"></i></button><button class="option" data-order="processing"><i class="ri-flashlight-line"></i><span>电费充值 · ¥30<small>2026-09-10 20:41 · 处理中</small></span><i class="ri-arrow-right-s-line"></i></button><button class="option" data-order="refund"><i class="ri-drop-line"></i><span>水费充值 · ¥20<small>2026-09-09 11:06 · 退款中</small></span><i class="ri-arrow-right-s-line"></i></button></div></section>
<section class="view" data-view="detail" hidden><button class="secondary" id="backList" style="margin-bottom:14px">〈 返回充值记录</button><div class="state-tabs" id="states"></div><div class="card center"><i id="stateIcon" class="ri-checkbox-circle-fill icon"></i><img class="state-ip" id="stateIp" src="output/ip/states/lanbao-orders-success.png" alt="庆祝充值成功的蓝宝机器人" hidden><h2 id="stateTitle">充值成功</h2><p id="stateHint" class="muted"></p><div style="font-size:29px;font-weight:700;margin:12px 0" id="amount">¥100.00</div></div><div class="card"><h2>订单详情</h2><div class="detail"><span>订单编号</span><b id="orderNo"></b></div><div class="detail"><span>房间</span><b>A栋 1F 101</b></div><div class="detail"><span>充值账户</span><b id="account"></b></div><div class="detail"><span>支付方式</span><b id="payment"></b></div><div class="detail"><span>创建时间</span><b id="created"></b></div><div class="detail"><span>当前状态</span><b id="status"></b></div></div><div class="card"><h2>进度与处理</h2><ul class="timeline" id="timeline"></ul><div class="hint" id="reason"></div></div><button class="secondary" id="support">联系校园能源服务</button><div class="card" id="supportPanel" hidden style="margin-top:14px"><h2>获得帮助</h2><p class="muted">请通过学校公布的能源服务渠道咨询，并提供订单编号。</p></div></section></div><nav class="tabbar"><button class="nav" id="home"><span class="nav-icon" aria-hidden="true"><img src="assets/nav/home.svg" alt=""></span><span>首页</span></button><button class="nav active" id="recharge"><span class="nav-icon" aria-hidden="true"><img src="assets/nav/recharge-active.svg" alt=""></span><span>充值</span></button><button class="nav" id="mine"><span class="nav-icon" aria-hidden="true"><img src="assets/nav/profile.svg" alt=""></span><span>我的</span></button></nav></main><script>const data={success:{name:'充值成功',icon:'ri-checkbox-circle-fill',color:'var(--color-teal-500)',amount:'¥100.00',no:'WX202609120018',account:'电表 · 01',payment:'微信支付',created:'2026-09-12 14:32',hint:'充值已到账，电费余额已更新。',reason:'如余额仍未更新，请稍后刷新或联系校园能源服务。',steps:['支付成功 · 14:32:05','充值到账 · 14:32:11']},failed:{name:'充值失败',icon:'ri-close-circle-fill',color:'var(--color-red-500)',amount:'¥50.00',no:'AL202609110009',account:'水表 · 01',payment:'支付宝支付',created:'2026-09-11 09:15',hint:'该笔充值未写入水表。',reason:'失败原因：设备未确认充值指令。处理方式：原路退款中，请勿重复支付。',steps:['支付成功 · 09:15:08','下发失败 · 09:16:10','退款已提交 · 09:16:15']},processing:{name:'处理中',icon:'ri-loader-4-line',color:'var(--color-blue-500)',amount:'¥30.00',no:'WX202609100021',account:'电表 · 01',payment:'微信支付',created:'2026-09-10 20:41',hint:'正在向表具写入余额，请勿重复支付。',reason:'若长时间未到账，系统将自动补发或发起退款。',steps:['支付成功 · 20:41:05','充值下发中 · 等待确认']},refund:{name:'退款中',icon:'ri-refund-2-line',color:'var(--color-orange-500)',amount:'¥20.00',no:'AL202609090006',account:'水表 · 01',payment:'支付宝支付',created:'2026-09-09 11:06',hint:'充值未到账，退款已提交。',reason:'退款将原路返回支付账户，具体到账时间以支付渠道为准。',steps:['支付成功 · 11:06:02','充值未到账 · 11:08:30','原路退款中 · 等待支付渠道']}};function render(state){if(!data[state])state='success';const d=data[state];document.querySelectorAll('.view').forEach(el=>el.hidden=el.dataset.view!=='detail');document.querySelector('#stateIcon').className=d.icon+' icon';document.querySelector('#stateIcon').style.color=d.color;const stateIp=document.querySelector('#stateIp');stateIp.hidden=state!=='success'&&state!=='failed'&&state!=='processing'&&state!=='refund';if(!stateIp.hidden){const ipAssets={success:['output/ip/states/lanbao-orders-success.png','庆祝充值成功的蓝宝机器人'],failed:['output/ip/states/lanbao-orders-failed.png','充值失败的蓝宝机器人'],processing:['output/ip/states/lanbao-orders-processing.png','正在处理充值的蓝宝机器人'],refund:['output/ip/states/lanbao-orders-refund.png','正在处理退款的蓝宝机器人']};[stateIp.src,stateIp.alt]=ipAssets[state]}for(const [id,value] of Object.entries({stateTitle:d.name,stateHint:d.hint,amount:d.amount,orderNo:d.no,account:d.account,payment:d.payment,created:d.created,status:d.name,reason:d.reason}))document.getElementById(id).textContent=value;document.querySelector('#timeline').innerHTML=d.steps.map(step=>{const parts=step.split(' · ');return `<li><i class="ri-check-line"></i>${parts[0]}<small>${parts[1]}</small></li>`}).join('');document.querySelector('#supportPanel').hidden=true;document.querySelector('.app').classList.add('detail-open');document.querySelector('.hero').classList.toggle('ip-detail',state==='success'||state==='failed'||state==='processing'||state==='refund');document.querySelector('#backDetail').hidden=false;document.querySelector('#heroRoom').hidden=true;history.replaceState(null,'','orders.html?view=detail&status='+state);window.scrollTo(0,0)}function list(){document.querySelector('.app').classList.remove('detail-open');document.querySelector('.hero').classList.remove('ip-detail');document.querySelector('#backDetail').hidden=true;document.querySelector('#heroRoom').hidden=false;document.querySelectorAll('.view').forEach(el=>el.hidden=el.dataset.view!=='list');history.replaceState(null,'','orders.html');window.scrollTo(0,0)}document.querySelectorAll('[data-order]').forEach(el=>el.onclick=()=>render(el.dataset.order));document.querySelector('#backList').onclick=list;document.querySelector('#backDetail').onclick=list;document.querySelector('#support').onclick=()=>document.querySelector('#supportPanel').hidden=false;document.querySelector('#home').onclick=()=>location.href='index.html';document.querySelector('#recharge').onclick=()=>location.href='recharge.html';document.querySelector('#mine').onclick=()=>location.href='my.html';const params=new URLSearchParams(location.search);params.get('view')==='detail'?render(params.get('status')||'success'):list();</script></body></html>
